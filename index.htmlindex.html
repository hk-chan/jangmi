<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JANGMI K-POP</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff3fb;color:#39243a;overflow:hidden}#menu{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#fff7fc,#ffe7f4)}h1{font-size:44px;margin:0 0 8px}.members{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:900px}.card{width:145px;padding:14px;border:3px solid #fff;border-radius:22px;background:white;box-shadow:0 5px 16px #d8bfd0;cursor:pointer;text-align:center}.card:hover{transform:translateY(-5px)}.face{width:76px;height:76px;border-radius:50%;margin:auto;background:#eee;position:relative;border:4px solid #555}.hair{position:absolute;inset:-5px;border-radius:50%;background:var(--c);clip-path:polygon(0 0,100% 0,100% 58%,82% 45%,65% 72%,50% 48%,35% 75%,15% 48%,0 62%)}.ribbon{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:27px}.name{font-weight:bold;margin-top:10px}.item{font-size:25px;margin-top:5px}button{border:0;border-radius:14px;padding:12px 22px;font-weight:bold;cursor:pointer;background:#ff75ad;color:white;font-size:16px}#worldMenu{display:none;height:100vh;min-height:100vh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;flex-direction:column;align-items:center;justify-content:flex-start;padding:28px 14px 60px;background:linear-gradient(#fff,#ffeaf5)}#worldMenu .members{max-width:1050px;width:100%;padding-bottom:8px}#worldMenu h1{margin-top:10px}#startWorld{position:sticky;bottom:14px;z-index:5;box-shadow:0 5px 14px #c98eaf;font-size:18px;padding:14px 28px}#worldMenu::-webkit-scrollbar{width:10px}#worldMenu::-webkit-scrollbar-thumb{background:#ff9fc5;border-radius:10px}.worldcard{width:175px;min-height:130px;padding:18px;border:3px solid white;border-radius:22px;background:white;box-shadow:0 5px 16px #d8bfd0;cursor:pointer;text-align:center;font-size:19px;font-weight:bold}.worldcard:hover{transform:translateY(-5px)}.worldbig{font-size:48px}.worldsmall{font-size:13px;font-weight:normal;margin-top:6px}#game{display:none;width:100vw;height:100vh;position:relative;background:#dff8ff}canvas{display:block;width:100%;height:100%}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;font-weight:bold;font-size:18px;text-shadow:0 1px white}#help{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#ffffffcc;padding:8px 15px;border-radius:14px}#back{position:fixed;right:12px;bottom:10px;background:#ffffffdd;color:#39243a}</style></head><body><div id="menu"><h1>🌹 JANGMI K-POP 🌹</h1><p>Chọn thành viên rồi khám phá các thế giới đồ ăn!</p><div class="members" id="members"></div></div><div id="worldMenu"><h1>🍽️ Chọn màn chơi</h1><p id="chosenMember"></p><div class="members" id="worldCards"></div><button onclick="backToMembers()">↩ Chọn thành viên khác</button><button id="startWorld" type="button" disabled onclick="startGameFromMenu()" style="margin-top:14px;opacity:.5;position:relative;z-index:20">▶️ BẮT ĐẦU MÀN CHƠI</button></div><div id="game"><canvas id="c" width="1200" height="650"></canvas><div id="hud"><span id="stats"></span><span id="world"></span></div><div id="gameOver" style="display:none;position:fixed;inset:0;background:#ffffffee;z-index:30;align-items:center;justify-content:center;flex-direction:column;text-align:center"><div style="font-size:58px">💖</div><h1 id="overTitle" style="margin:8px 0">HẾT MẠNG!</h1><div id="finalScore" style="font-size:24px;font-weight:bold;margin:8px 0 18px"></div><button onclick="restartSameGame()">🔄 CHƠI LẠI</button><button onclick="location.reload()" style="margin-top:10px;background:#fff;color:#39243a;border:2px solid #ff75ad">↩ CHỌN LẠI</button></div><div id="help">← → / A D: chạy • Space / W / ↑: nhảy</div><button id="back" onclick="location.reload()">↩ Chọn lại</button></div><script>
const chars=[{n:'Kasana',c:'#e98bb5',i:'🌸',power:'Tăng tốc'},{n:'Harin',c:'#a878e8',i:'🪻',power:'Nhảy cao'},{n:'Eunseo',c:'#65d9c9',i:'💎',power:'Lơ lửng'},{n:'Rosa',c:'#f28a42',i:'🌹',power:'Rơi chậm'},{n:'Amiine',c:'#f2d34e',i:'🌻',power:'Chống 1 va chạm'}];
const commonPowers=[{id:'rocket',icon:'🚀',name:'Tên lửa',time:300},{id:'magnet',icon:'🧲',name:'Nam châm',time:420},{id:'shield',icon:'🛡️',name:'Khiên',time:360},{id:'wings',icon:'🪽',name:'Cánh bay',time:300},{id:'speed',icon:'⚡',name:'Tăng tốc',time:300}];
const worlds=[{name:'🍓 THẾ GIỚI DÂU',bg:'#ffe1ef',ground:'#ef91b8',food:'🍓'},{name:'🍫 THẾ GIỚI CHOCOLATE',bg:'#ead7cb',ground:'#9b6b55',food:'🍫'},{name:'🍜 THẾ GIỚI MÌ',bg:'#fff0b8',ground:'#e4b84b',food:'🍜'},{name:'🍰 THẾ GIỚI BÁNH',bg:'#e8dcff',ground:'#b58de0',food:'🍰'},{name:'🍉 THẾ GIỚI TRÁI CÂY',bg:'#d9ffd9',ground:'#70c47c',food:'🍉',foods:['🍉','🍎','🍊','🍇','🍌','🍍','🥝','🍓','🍑']}];
const menu=document.getElementById('members');chars.forEach((x,k)=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<div class="face"><div class="hair" style="--c:${x.c}"></div><div class="ribbon">🎀</div></div><div class="name">${x.n}</div><div class="item">${x.i}</div><small>${x.power}</small>`;d.onclick=()=>chooseMember(k);menu.appendChild(d)});
const worldCards=document.getElementById('worldCards'); worlds.forEach((w,i)=>{let d=document.createElement('div');d.className='worldcard';d.innerHTML=`<div class="worldbig">${w.food}</div><div>${w.name.replace(w.food+' ','')}</div><div class="worldsmall">Chọn rồi bấm BẮT ĐẦU</div>`;d.onclick=()=>selectWorld(i);worldCards.appendChild(d)}); let selected=0, selectedWorld=null; function selectWorld(i){selectedWorld=i;document.querySelectorAll('.worldcard').forEach((c,j)=>c.style.outline=j===i?'4px solid #ff75ad':'');const b=document.getElementById('startWorld');b.disabled=false;b.style.opacity='1';b.textContent='▶️ BẮT ĐẦU '+worlds[i].food+' '+worlds[i].name.replace(worlds[i].food+' ','').toUpperCase()} function startGameFromMenu(){if(selectedWorld===null){alert('HK hãy chọn một thế giới trước nha 😭');return;} start(selected,selectedWorld);} function chooseMember(k){selected=k;selectedWorld=null;document.querySelectorAll('.worldcard').forEach(c=>c.style.outline='');const b=document.getElementById('startWorld');b.disabled=true;b.style.opacity='.5';b.textContent='▶️ BẮT ĐẦU MÀN CHƠI';document.getElementById('menu').style.display='none';document.getElementById('worldMenu').style.display='flex';document.getElementById('worldMenu').scrollTop=0;document.getElementById('chosenMember').textContent='Thành viên: '+chars[k].i+' '+chars[k].n+' • Hãy chọn thế giới!';} function backToMembers(){document.getElementById('worldMenu').style.display='none';document.getElementById('menu').style.display='flex';} const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let me,world,keys={},x,y,vy,cam,lives,items,invuln,won,plats,enemies,powerups,hearts,score=0,best=0,power=null,powerTime=0,lastX=0,raf=0;addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function start(k,w){me=chars[k];world=w;document.getElementById('worldMenu').style.display='none';document.getElementById('game').style.display='block';document.getElementById('gameOver').style.display='none';x=80;y=400;vy=0;cam=0;lives=5;items=0;score=0;best=Number(localStorage.getItem('jangmiBest')||0);power=null;powerTime=0;invuln=0;won=false;lastX=0;hearts=[];document.getElementById('menu').style.display='none';makeLevel();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function makeLevel(){plats=[];enemies=[];powerups=[];hearts=[];let px=0;let py=500;plats.push({x:0,y:550,w:900,h:100,got:false});for(let i=1;i<34;i++){px=960+(i-1)*210;let targetY=470-((i+1)%3)*18;py=Math.max(py-22,Math.min(py+22,targetY));let pw=150+(i%3)*8;plats.push({x:px,y:py,w:pw,h:25,got:false});if(i%2===0)enemies.push({x:px+55,y:py-35,w:34,h:34,dir:i%4?1:-1});if(i%3===0)powerups.push({x:px+75,y:py-65,id:commonPowers[(i/3-1)%commonPowers.length].id,got:false});if(i%4===0)hearts.push({x:px+45,y:py-35,got:false});}lastX=plats[plats.length-1].x+plats[plats.length-1].w}
function extendLevel(){let base=lastX+60;let prevY=plats.length?plats[plats.length-1].y:500;for(let i=1;i<=14;i++){let px=base+(i-1)*210;let targetY=470-((Math.floor(base/210)+i+1)%3)*18;let py=Math.max(prevY-22,Math.min(prevY+22,targetY));let pw=150+((i+Math.floor(base/210))%3)*8;plats.push({x:px,y:py,w:pw,h:25,got:false});let n=i+Math.floor(base/210);if(n%2===0)enemies.push({x:px+55,y:py-35,w:34,h:34,dir:i%4?1:-1});if(n%3===0)powerups.push({x:px+75,y:py-65,id:commonPowers[Math.floor(px/210)%commonPowers.length].id,got:false});if(n%4===0)hearts.push({x:px+45,y:py-35,got:false});prevY=py;}lastX=plats[plats.length-1].x+plats[plats.length-1].w}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function reset(){x=Math.max(50,x-180);y=350;vy=0;invuln=70}
function update(){let speed=me.n==='Kasana'?5.5:4.2;if(power==='speed')speed*=1.8;if(power==='rocket')speed*=1.35;if(keys.arrowleft||keys.a)x-=speed;if(keys.arrowright||keys.d)x+=speed;let on=false;for(const p of plats)if(x+30>p.x&&x<p.x+p.w&&y+48<=p.y+8&&y+48>=p.y-2&&vy>=0){y=p.y-48;vy=0;on=true}if((keys[' ']||keys.w||keys.arrowup)&&on)vy=me.n==='Harin'?-13.5:-11;if(power==='wings'&&!on)vy+=0.18;if(me.n==='Eunseo'&&!on&&keys[' '])vy-=.12;vy+=me.n==='Rosa'?.34:.55;y+=vy;if(invuln)invuln--;if(x<0)x=0;for(const p of plats){let ix=p.x+p.w/2,iy=p.y-35;if(!p.got&&Math.abs(x+20-ix)<35&&Math.abs(y+24-iy)<45){p.got=true;items++;score+=100}}for(const h of hearts){if(!h.got&&Math.abs(x+20-h.x)<45&&Math.abs(y+24-h.y)<55){h.got=true;if(lives<10)lives++;score+=150}}for(const pu of powerups){if(!pu.got&&Math.abs(x+20-pu.x)<42&&Math.abs(y+24-pu.y)<55){pu.got=true;power=pu.id;powerTime=commonPowers.find(q=>q.id===pu.id).time;invuln=90}}if(power==='magnet'){for(const p of plats){if(!p.got&&Math.abs(p.x+p.w/2-x)<180){p.got=true;items++;score+=100}}}for(const e of enemies){e.x+=e.dir*1.5;if(e.x<0||e.x>lastX)e.dir*=-1;if(hit({x:x+5,y:y+5,w:38,h:43},e)&&!invuln&&power!=='shield'){lives--;reset();if(lives<=0){gameOver();return}}}if(y>700){lives--;reset();if(lives<=0){gameOver();return}}score+=Math.max(0,Math.floor(speed));if(score>best){best=score;localStorage.setItem('jangmiBest',best)}if(powerTime>0){powerTime--;if(powerTime===0)power=null}if(x>lastX-1200)extendLevel();document.getElementById('stats').textContent=`${me.i} ${me.n} • ❤️ ${lives} • 🏆 ${score} • 👑 Kỷ lục ${best} • ${worlds[world].food} ${items} ${power?('• '+commonPowers.find(q=>q.id===power).icon):''}`;document.getElementById('world').textContent=worlds[world].name}
function draw(){const W=canvas.width,H=canvas.height,w=worlds[world];ctx.fillStyle=w.bg;ctx.fillRect(0,0,W,H);cam=Math.max(0,x-350);ctx.font='34px sans-serif';let deco=w.foods||[w.food];for(let i=0;i<24;i++)ctx.fillText(deco[i%deco.length],i*320-cam%320,110+(i%4)*48);for(const p of plats){ctx.fillStyle=w.ground;ctx.fillRect(p.x-cam,p.y,p.w,p.h);ctx.fillStyle='#ffffff55';ctx.fillRect(p.x-cam,p.y,p.w,6);if(!p.got){ctx.font='30px sans-serif';ctx.fillText((w.foods||[w.food])[Math.floor(p.x/250)%(w.foods||[w.food]).length],p.x+p.w/2-15-cam,p.y-8)}}for(const e of enemies){ctx.font='34px sans-serif';ctx.fillText('👾',e.x-cam,e.y+30)}for(const h of hearts){if(!h.got){ctx.font='26px sans-serif';ctx.fillText('❤️',h.x-cam-13,h.y)}}for(const pu of powerups){if(!pu.got){let q=commonPowers.find(z=>z.id===pu.id);ctx.font='34px sans-serif';ctx.fillText(q.icon,pu.x-cam,pu.y)}}if(invuln%2===0){ctx.fillStyle=me.c;ctx.beginPath();ctx.arc(x+24-cam,y+22,22,0,Math.PI*2);ctx.fill();ctx.fillStyle='#333';ctx.fillRect(x+14-cam,y+18,5,5);ctx.fillRect(x+29-cam,y+18,5,5);ctx.font='27px sans-serif';ctx.fillText('🎀',x+2-cam,y-1);ctx.font='28px sans-serif';ctx.fillText(me.i,x+7-cam,y+42)}}function loop(){update();draw();if(!won)raf=requestAnimationFrame(loop)}
</script></body></html>
